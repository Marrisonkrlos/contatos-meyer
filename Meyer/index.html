<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyer Tecnologia - Sistema</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --primary: #0f172a; --primary-hover: #1e293b;
            --accent: #2563eb; --accent-hover: #1d4ed8;
            --success: #16a34a; --success-hover: #15803d;
            --danger: #dc2626; --danger-hover: #b91c1c;
            --warning: #f59e0b; --warning-hover: #d97706;
            --bg: #f8fafc; --card-bg: #ffffff;
            --form-bg: #f1f5f9; --text-main: #334155;
            --text-muted: #64748b; --border: #e2e8f0;
            --th-bg: #0f172a; --th-color: #ffffff;
            --tr-hover: #f8fafc;
        }

        body.dark-mode {
            --primary: #60a5fa; --bg: #0f172a;
            --card-bg: #1e293b; --form-bg: #0f172a;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: #334155; --th-bg: #334155;
            --th-color: #f8fafc; --tr-hover: #334155;
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg);
            color: var(--text-main); margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            transition: background-color 0.3s, color 0.3s; padding: 20px;
        }

        /* --- CONTROLES GERAIS --- */
        .theme-toggle {
            position: absolute; top: 20px; right: 20px;
            background: var(--bg); border: 1px solid var(--border); color: var(--text-main);
            padding: 8px 16px; border-radius: 20px; cursor: pointer;
            font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s; z-index: 100;
        }

        .hidden { display: none !important; }

        .logo-meyer { display: block; max-width: 200px; margin: 0 auto 20px auto; mix-blend-mode: multiply; transition: filter 0.3s ease; }
        body.dark-mode .logo-meyer { filter: invert(1) brightness(1.2); mix-blend-mode: screen; }

        /* --- TELA DE LOGIN / CADASTRO --- */
        #telaAuth {
            width: 100%; max-width: 400px; background: var(--card-bg);
            padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center; margin: auto; 
        }

        #loginForm, #cadastroAuthForm { display: flex; flex-direction: column; }
        
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { width: 100%; padding-right: 40px; }
        .toggle-password { position: absolute; right: 12px; cursor: pointer; color: var(--text-muted); font-size: 16px; transition: color 0.2s; }
        .toggle-password:hover { color: var(--primary); }
        
        .form-options { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 15px; }
        .checkbox-label { font-weight: 500; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; cursor: pointer; flex-direction: row; justify-content: flex-start;}
        .checkbox-label input { width: auto; margin: 0; cursor: pointer; }

        .status-msg, .error-msg { font-size: 14px; margin-top: 15px; font-weight: 500; display: none; }
        .error, .error-msg { color: var(--danger); }
        .success { color: var(--success); }
        
        .link-acao { display: inline-block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 14px; cursor: pointer; }
        .link-acao:hover { color: var(--accent); text-decoration: underline; }

        .btn-login { width: 100%; padding: 14px; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; transition: background-color 0.2s; margin-top: 10px; }
        .btn-login:hover { background-color: var(--accent-hover); }

        /* --- TELA DO APLICATIVO (CRUD) --- */
        #telaApp {
            width: 100%; max-width: 1200px; background: var(--card-bg);
            border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); 
            position: relative; margin-top: 40px; overflow: hidden; padding-top: 30px;
        }

        .app-header {
            display: flex; justify-content: center; align-items: center;
            background: transparent; padding: 0 30px 15px 30px; 
        }
        
        .nav-menu { display: flex; gap: 15px; }
        .nav-btn {
            background: transparent; border: none; color: var(--text-main);
            font-size: 15px; font-weight: 600; padding: 10px 20px; border-radius: 8px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .nav-btn:hover { background: var(--border); }
        .nav-btn.active { background: var(--accent); color: white; }
        .nav-btn.btn-sair { color: var(--danger); }
        .nav-btn.btn-sair:hover { background: var(--danger); color: white; }

        .app-content { padding: 15px 40px 30px 40px; }

        h2 { text-align: center; color: var(--primary); font-size: 24px; margin-bottom: 20px; font-weight: 700; margin-top: 0; }

        #cadastroForm {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; 
            background: var(--bg); padding: 24px; border-radius: 8px; border: 1px solid var(--border);
        }

        .form-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 15px; }
        label { margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--primary); display: flex; justify-content: space-between; }
        
        input, textarea, select {
            padding: 12px 14px; background-color: var(--card-bg); color: var(--text-main);
            border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
            transition: border-color 0.2s; font-family: inherit; width: 100%;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        input::placeholder, textarea::placeholder { color: var(--text-muted); }

        .form-actions { grid-column: span 2; display: flex; gap: 15px; margin-top: 10px; }
        .form-actions button { flex: 1; padding: 14px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; color: white;}
        #btnSalvar { background-color: var(--accent); }
        #btnSalvar:hover { background-color: var(--accent-hover); }
        #btnCancelar { background-color: #94a3b8; display: none; }
        #btnCancelar:hover { background-color: #64748b; }

        /* Tabela */
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background-color: var(--th-bg); color: var(--th-color); font-weight: 600; text-transform: uppercase; font-size: 12px; }
        th:first-child { border-top-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; }
        tr:hover td { background-color: var(--tr-hover); }

        .client-name { font-weight: 600; color: var(--primary); display: block; }
        .client-date { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .combo-box { display: flex; align-items: stretch; margin-top: 4px; width: 100%; min-width: 0; position: relative; }
        .combo-box + .combo-box { margin-top: 8px; }
        
        .combo-input { 
            flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-right: none; 
            border-radius: 6px 0 0 6px; background-color: var(--card-bg); font-size: 13px; 
            display: flex; align-items: center; gap: 6px; min-width: 0; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        
        .combo-select-wrapper { position: relative; width: 32px; border: 1px solid var(--border); border-radius: 0 6px 6px 0; background-color: var(--form-bg); flex-shrink: 0; }
        .combo-arrow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; color: var(--text-muted); pointer-events: none; }
        .combo-select { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }

        .action-buttons { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; }
        .btn-whatsapp, .btn-excluir, .btn-editar { width: 34px; height: 34px; text-decoration: none; border-radius: 6px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: none; flex-shrink: 0; color: white;}
        .btn-whatsapp { background-color: var(--success); }
        .btn-editar { background-color: var(--warning); }
        .btn-excluir { background-color: var(--danger); }

        #toast { visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; top: 30px; transform: translateX(-50%); font-size: 15px; font-weight: 600; opacity: 0; transition: opacity 0.3s, top 0.3s; }
        #toast.show { visibility: visible; opacity: 1; top: 50px; }

        @media (max-width: 768px) {
            .app-header { flex-direction: column; gap: 15px; padding: 15px; }
            .nav-menu { width: 100%; justify-content: center; flex-wrap: wrap; }
            #cadastroForm { grid-template-columns: 1fr; }
            .form-actions { grid-column: span 1; flex-direction: column; }
            .theme-toggle { position: static; margin-bottom: 10px; width: 100%; justify-content: center; }
            body { padding-top: 10px; }
            #telaApp { margin-top: 10px; }
            .app-content { padding: 20px; }
        }
    </style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Modo Escuro</button>
<div id="toast">Operação realizada com sucesso!</div>

<!-- TELA 1: LOGIN E CADASTRO -->
<div id="telaAuth">
    <img src="meyer.jpeg" alt="Meyer Tecnologia" class="logo-meyer" onerror="this.style.display='none'">
    
    <div id="sectionLogin">
        <h2>Entrar</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="emailLogin">E-mail</label>
                <input type="email" id="emailLogin" required placeholder="Digite seu e-mail">
            </div>
            <div class="form-group">
                <label for="senhaLogin">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="senhaLogin" required placeholder="Digite sua senha">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('senhaLogin', this)"></i>
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="lembrarEmail"> Lembrar meu e-mail
                </label>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
            <div id="errorMsgLogin" class="error-msg">E-mail ou senha incorretos.</div>
        </form>
        <span class="link-acao" onclick="alternarFormularios('cadastro')">Criar uma nova conta</span>
    </div>

    <div id="sectionCadastro" class="hidden">
        <h2>Criar Conta</h2>
        <form id="cadastroAuthForm">
            <div class="form-group">
                <label for="emailCadastro">E-mail</label>
                <input type="email" id="emailCadastro" required placeholder="Digite seu e-mail">
            </div>
            <div class="form-group">
                <label for="senhaCadastro">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="senhaCadastro" required placeholder="Crie uma senha (mín. 6)" minlength="6">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('senhaCadastro', this)"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="senhaConfirm">Confirmar Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="senhaConfirm" required placeholder="Repita a senha">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('senhaConfirm', this)"></i>
                </div>
            </div>
            <button type="submit" class="btn-login" id="btnCadastro">Cadastrar</button>
            <div id="statusMsgCadastro" class="status-msg"></div>
        </form>
        <span class="link-acao" onclick="alternarFormularios('login')">Já tem uma conta? Voltar ao Login</span>
    </div>
</div>

<!-- TELA 2: APLICATIVO PRINCIPAL -->
<div id="telaApp" class="hidden">
    <img src="meyer.jpeg" alt="Meyer Tecnologia" class="logo-meyer" onerror="this.style.display='none'">

    <div class="app-header">
        <div class="nav-menu">
            <button class="nav-btn active" id="btnNavInicio" onclick="mudarAba('inicio')"><i class="fa-solid fa-house"></i> Início</button>
            <button class="nav-btn" id="btnNavContatos" onclick="mudarAba('contatos')"><i class="fa-solid fa-address-book"></i> Contatos</button>
            <button class="nav-btn btn-sair" onclick="fazerLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
        </div>
    </div>

    <div class="app-content">
        <div id="abaInicio">
            <h2>Cadastro de Cliente</h2>
            <form id="cadastroForm">
                <div class="form-group">
                    <label for="cliente">Cliente</label>
                    <input type="text" id="cliente" required placeholder="Ex: 0001 Nome da empresa">
                </div>
                <div class="form-group">
                    <label for="local"><span>Local</span><small>(Um por linha)</small></label>
                    <textarea id="local" rows="2" placeholder="Ex: Recepção&#10;Financeiro"></textarea>
                </div>

                <div class="form-group">
                    <label for="serie"><span>Nº de Série</span><small>(Uma por linha)</small></label>
                    <textarea id="serie" required rows="2" placeholder="Ex: SN123456789&#10;SN987654321"></textarea>
                </div>
                <div class="form-group">
                    <label for="modelo"><span>Máquina (Modelo)</span><small>(Uma por linha)</small></label>
                    <textarea id="modelo" required rows="2" placeholder="Ex: HP LaserJet&#10;Epson L3150"></textarea>
                </div>

                <div class="form-group">
                    <label for="responsavel"><span>Responsável</span><small>(Um por linha)</small></label>
                    <textarea id="responsavel" required rows="2" placeholder="Ex: João da Silva&#10;Maria Souza"></textarea>
                </div>
                <div class="form-group">
                    <label for="contato"><span>Contato (WhatsApp)</span><small>(Um por linha)</small></label>
                    <textarea id="contato" required rows="2" placeholder="(82) 99999-9999&#10;(82) 88888-8888"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btnSalvar">Salvar Cadastro</button>
                    <button type="button" id="btnCancelar" onclick="cancelarEdicao()">Cancelar Edição</button>
                </div>
            </form>
        </div>

        <div id="abaContatos" class="hidden">
            <h2>Contatos Salvos</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Série e Máquina</th>
                            <th>Responsável e Contato</th>
                            <th>Local</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- SDK DO SUPABASE VIA CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // --- CONEXÃO COM O SUPABASE ---
    const SUPABASE_URL = "https://xmwsxktweauwedzenkho.supabase.co";
    const SUPABASE_KEY = "sb_publishable_EbMgDX6W2c08CqjRTSiMaA_l5KqsXkl";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- MODO ESCURO/CLARO ---
    const themeToggleBtn = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggleBtn.innerHTML = '☀️ Modo Claro';
    }
    window.toggleTheme = function() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        themeToggleBtn.innerHTML = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
    };

    window.togglePassword = function(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    };

    // --- NAVEGAÇÃO ENTRE TELAS ---
    const telaAuth = document.getElementById('telaAuth');
    const telaApp = document.getElementById('telaApp');

    function alternarFormularios(alvo) {
        document.getElementById('sectionLogin').classList.toggle('hidden', alvo !== 'login');
        document.getElementById('sectionCadastro').classList.toggle('hidden', alvo !== 'cadastro');
    }

    function mostrarApp() {
        telaAuth.classList.add('hidden');
        telaApp.classList.remove('hidden');
        mudarAba('inicio'); 
        renderizarTabela(); 
    }

    async function fazerLogout() {
        await _supabase.auth.signOut();
        telaApp.classList.add('hidden');
        telaAuth.classList.remove('hidden');
        alternarFormularios('login');
        document.getElementById('senhaLogin').value = '';
    }

    window.mudarAba = function(aba) {
        document.getElementById('abaInicio').classList.add('hidden');
        document.getElementById('abaContatos').classList.add('hidden');
        document.getElementById('btnNavInicio').classList.remove('active');
        document.getElementById('btnNavContatos').classList.remove('active');

        if (aba === 'inicio') {
            document.getElementById('abaInicio').classList.remove('hidden');
            document.getElementById('btnNavInicio').classList.add('active');
        } else if (aba === 'contatos') {
            document.getElementById('abaContatos').classList.remove('hidden');
            document.getElementById('btnNavContatos').classList.add('active');
            renderizarTabela();
        }
    };

    function mostrarToast(mensagem, tipo="success") {
        const toast = document.getElementById("toast");
        toast.textContent = mensagem;
        toast.style.backgroundColor = tipo === "error" ? "var(--danger)" : "var(--success)";
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // --- SUPABASE AUTENTICAÇÃO ---
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        const email = document.getElementById('emailLogin').value;
        const password = document.getElementById('senhaLogin').value;
        const lembrar = document.getElementById('lembrarEmail').checked;
        const btnLogin = document.getElementById('btnLogin');
        const errorMsg = document.getElementById('errorMsgLogin');

        btnLogin.textContent = "Validando..."; btnLogin.disabled = true;
        
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
            errorMsg.style.display = 'block';
            btnLogin.textContent = "Entrar"; btnLogin.disabled = false;
            setTimeout(() => { errorMsg.style.display = 'none'; }, 4000);
        } else {
            if (lembrar) localStorage.setItem('lembrar_email', email);
            else localStorage.removeItem('lembrar_email');

            btnLogin.textContent = "Entrar"; btnLogin.disabled = false;
            mostrarApp();
        }
    });

    document.getElementById('cadastroAuthForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        const email = document.getElementById('emailCadastro').value;
        const password = document.getElementById('senhaCadastro').value;
        const senhaConfirm = document.getElementById('senhaConfirm').value;
        const btnCadastro = document.getElementById('btnCadastro');
        const statusMsg = document.getElementById('statusMsgCadastro');

        const showMsg = (texto, tipo) => { statusMsg.textContent = texto; statusMsg.className = `status-msg ${tipo}`; statusMsg.style.display = 'block'; };

        if (password !== senhaConfirm) return showMsg("As senhas não coincidem.", "error");

        btnCadastro.textContent = "Cadastrando..."; btnCadastro.disabled = true;

        const { data, error } = await _supabase.auth.signUp({ email, password });

        if (error) {
            showMsg("Erro ao cadastrar. E-mail já em uso ou senha fraca.", "error");
            btnCadastro.textContent = "Cadastrar"; btnCadastro.disabled = false;
        } else {
            showMsg("Cadastro realizado com sucesso! Faça seu login.", "success");
            setTimeout(() => {
                alternarFormularios('login');
                document.getElementById('emailLogin').value = email; 
                btnCadastro.textContent = "Cadastrar"; btnCadastro.disabled = false;
                statusMsg.style.display = 'none';
                document.getElementById('cadastroAuthForm').reset();
            }, 2000);
        }
    });

    // --- CRUD SUPABASE (BANCO DE DADOS) ---
    document.getElementById('contato').addEventListener('input', function(e) {
        let lines = e.target.value.split('\n');
        let maskedLines = lines.map(line => {
            let x = line.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            if (!x) return ''; 
            return !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
        e.target.value = maskedLines.join('\n');
    });

    let cadastros = [];
    let editandoId = null; 
    const formCrud = document.getElementById('cadastroForm');
    const btnSalvar = document.getElementById('btnSalvar');
    const btnCancelar = document.getElementById('btnCancelar');

    function gerarLinkWhatsapp(cadastro, selectedIndex = 0) {
        const arrContatosOriginal = cadastro.contato ? cadastro.contato.split('\n').filter(c => c.trim() !== '') : [];
        const arrModelosOriginal = cadastro.modelo ? cadastro.modelo.split('\n').filter(m => m.trim() !== '') : [];
        const arrSeriesOriginal = cadastro.serie ? cadastro.serie.split('\n').filter(s => s.trim() !== '') : [];
        
        const num = arrContatosOriginal[selectedIndex] || arrContatosOriginal[arrContatosOriginal.length - 1] || "";
        const numeroLimpo = num.replace(/\D/g, '');
        let msgPadrao = "";

        if (arrContatosOriginal.length <= 1 && arrModelosOriginal.length > 1) {
            let listaMaquinas = "";
            const maxMaquinas = Math.max(arrModelosOriginal.length, arrSeriesOriginal.length);
            for (let i = 0; i < maxMaquinas; i++) {
                let m = arrModelosOriginal[i] || arrModelosOriginal[arrModelosOriginal.length - 1] || "";
                let s = arrSeriesOriginal[i] || arrSeriesOriginal[arrSeriesOriginal.length - 1] || "";
                listaMaquinas += `\n- ${m} (Série: ${s})`;
            }
            msgPadrao = `Olá, Tudo bem? Bem vindo(a) ao Atendimento da Meyer Soluções. Poderia nos ajudar com as impressoras:${listaMaquinas}`;
        } else {
            const modeloSelecionado = arrModelosOriginal[selectedIndex] || arrModelosOriginal[arrModelosOriginal.length - 1] || "";
            const serieSelecionada = arrSeriesOriginal[selectedIndex] || arrSeriesOriginal[arrSeriesOriginal.length - 1] || "";
            msgPadrao = `Olá, Tudo bem? Bem vindo(a) ao Atendimento da Meyer Soluções. Poderia nos ajudar com a impressora ${modeloSelecionado} - Série: ${serieSelecionada} ?`;
        }

        return `https://wa.me/55${numeroLimpo}?text=${encodeURIComponent(msgPadrao)}`;
    }

    window.sincronizarTodos = function(rowIndex, selectedIndex) {
        const prefixes = ['serie', 'modelo', 'responsavel', 'contato', 'local'];
        
        prefixes.forEach(prefix => {
            const sel = document.getElementById(`${prefix}Select-${rowIndex}`);
            const div = document.getElementById(`${prefix}Input-${rowIndex}`);
            if (sel && div) {
                sel.value = selectedIndex; 
                let text = sel.options[sel.selectedIndex]?.text || '';
                let iconHtml = prefix === 'contato' ? '<i class="fa-brands fa-whatsapp" style="color: #25D366; font-size: 15px;"></i> ' : '';
                let prefixHtml = prefix === 'serie' ? 'Série: ' : '';
                div.innerHTML = `${iconHtml}${prefixHtml}${text}`;
            }
        });

        const btnWpp = document.getElementById(`btnWpp-${rowIndex}`);
        if (btnWpp) {
            btnWpp.href = gerarLinkWhatsapp(cadastros[rowIndex], selectedIndex);
        }
    };

    function createComboOrText(arr, idPrefix, index, isSerie = false, isContato = false) {
        if (!arr || arr.length === 0 || (arr.length === 1 && arr[0] === '')) return '-'; 
        
        let iconHtml = isContato ? '<i class="fa-brands fa-whatsapp" style="color: #25D366; font-size: 15px;"></i> ' : '';
        let prefixHtml = isSerie ? 'Série: ' : '';

        if (arr.length <= 1) {
            let val = arr[0] || '';
            if (isSerie) return `<div style="font-weight:400; color:var(--text-muted); margin-bottom:4px;">${prefixHtml}${val}</div>`;
            if (isContato) return `<div style="font-weight:400; color:var(--text-muted); margin-top:4px; display:flex; align-items:center; gap:6px;">${iconHtml}${val}</div>`;
            return `<div style="font-weight:600; color:var(--primary);">${val}</div>`;
        }
        
        let options = arr.map((item, i) => `<option value="${i}">${item}</option>`).join('');
        let displayVal = `${iconHtml}${prefixHtml}${arr[0]}`;
        let extraStyle = (isSerie || isContato) ? 'font-weight:400; color:var(--text-muted);' : 'font-weight:600; color:var(--primary);';
        
        return `<div class="combo-box">
            <div id="${idPrefix}Input-${index}" class="combo-input" style="${extraStyle}">${displayVal}</div>
            <div class="combo-select-wrapper">
                <i class="fa-solid fa-chevron-down combo-arrow"></i>
            </div>
            <select id="${idPrefix}Select-${index}" class="combo-select" onchange="sincronizarTodos(${index}, this.value)">
                ${options}
            </select>
        </div>`;
    }

    async function renderizarTabela() {
        const tabelaCorpo = document.getElementById('tabelaCorpo');
        tabelaCorpo.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Carregando dados...</td></tr>'; 

        const { data, error } = await _supabase.from('clientes').select('*').order('id', { ascending: true });

        if (error || !data || data.length === 0) {
            tabelaCorpo.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Nenhum registro encontrado.</td></tr>';
            return;
        }

        cadastros = data;
        tabelaCorpo.innerHTML = '';

        cadastros.forEach((item, index) => {
            let arrSeries = item.serie ? item.serie.split('\n').filter(s => s.trim() !== '') : [];
            let arrModelos = item.modelo ? item.modelo.split('\n').filter(m => m.trim() !== '') : [];
            let arrResponsaveis = item.responsavel ? item.responsavel.split('\n').filter(r => r.trim() !== '') : [];
            let arrContatos = item.contato ? item.contato.split('\n').filter(c => c.trim() !== '') : [];
            let arrLocais = item.local ? item.local.split('\n').filter(l => l.trim() !== '') : [];

            let maxLines = Math.max(arrSeries.length, arrModelos.length, arrResponsaveis.length, arrContatos.length, arrLocais.length);
            
            const normalizeArr = (arr, max) => {
                let res = [...arr];
                while (res.length > 0 && res.length < max) { res.push(res[res.length - 1]); }
                return res;
            };

            arrSeries = normalizeArr(arrSeries, maxLines);
            arrModelos = normalizeArr(arrModelos, maxLines);
            arrResponsaveis = normalizeArr(arrResponsaveis, maxLines);
            arrContatos = normalizeArr(arrContatos, maxLines);
            arrLocais = normalizeArr(arrLocais, maxLines);

            const linkWhatsapp = gerarLinkWhatsapp(item, 0);

            tabelaCorpo.innerHTML += `
                <tr>
                    <td>
                        <span class="client-name">${item.cliente}</span>
                        <div class="client-date">Atualizado: ${item.dataHora || '-'}</div>
                    </td>
                    <td>
                        ${createComboOrText(arrSeries, 'serie', index, true, false)}
                        ${createComboOrText(arrModelos, 'modelo', index, false, false)}
                    </td>
                    <td>
                        ${createComboOrText(arrResponsaveis, 'responsavel', index, false, false)}
                        ${createComboOrText(arrContatos, 'contato', index, false, true)}
                    </td>
                    <td>
                        ${createComboOrText(arrLocais, 'local', index, false, false)}
                    </td>
                    <td>
                        <div class="action-buttons">
                            <a href="${linkWhatsapp}" id="btnWpp-${index}" target="_blank" class="btn-whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                            <button class="btn-editar" onclick="editarCadastro(${item.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-excluir" onclick="excluirCadastro(${item.id})"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </td>
                </tr>`;
        });
    }

    window.editarCadastro = function(id) {
        const item = cadastros.find(c => c.id === id);
        if (!item) return;

        ['cliente', 'responsavel', 'modelo', 'serie', 'contato', 'local'].forEach(field => document.getElementById(field).value = item[field] || '');
        editandoId = id;
        btnSalvar.innerHTML = '<i class="fa-solid fa-check"></i> Atualizar'; btnSalvar.style.backgroundColor = 'var(--warning)';
        btnCancelar.style.display = 'block';
        
        mudarAba('inicio'); 
    }

    window.cancelarEdicao = function() {
        formCrud.reset(); editandoId = null;
        btnSalvar.textContent = 'Salvar Cadastro'; btnSalvar.style.backgroundColor = 'var(--accent)';
        btnCancelar.style.display = 'none';
        mudarAba('contatos'); 
    }

    formCrud.addEventListener('submit', async function(e) {
        e.preventDefault(); 
        const agora = new Date();
        const dados = {
            cliente: document.getElementById('cliente').value, 
            responsavel: document.getElementById('responsavel').value,
            modelo: document.getElementById('modelo').value, 
            serie: document.getElementById('serie').value,
            contato: document.getElementById('contato').value, 
            local: document.getElementById('local').value,
            dataHora: `${agora.toLocaleDateString('pt-BR')} ${agora.toLocaleTimeString('pt-BR')}`
        };

        if (editandoId) { 
            const { error } = await _supabase.from('clientes').update(dados).eq('id', editandoId);
            if (!error) {
                cancelarEdicao(); 
                mostrarToast("Atualizado!"); 
            } else {
                mostrarToast("Erro ao atualizar", "error");
            }
        } 
        else { 
            const { error } = await _supabase.from('clientes').insert([dados]);
            if (!error) {
                formCrud.reset(); 
                document.getElementById('cliente').focus(); 
                mostrarToast("Salvo!"); 
            } else {
                mostrarToast("Erro ao salvar", "error");
            }
        }

        renderizarTabela();
    });

    window.excluirCadastro = async function(id) {
        if(confirm("Deseja excluir este registro?")) {
            const { error } = await _supabase.from('clientes').delete().eq('id', id);
            if (!error) {
                if (editandoId === id) cancelarEdicao();
                renderizarTabela(); 
                mostrarToast("Excluído!");
            } else {
                mostrarToast("Erro ao excluir", "error");
            }
        }
    }

    // --- VERIFICA SESSÃO AO CARREGAR ---
    window.addEventListener('DOMContentLoaded', async () => {
        const emailSalvo = localStorage.getItem('lembrar_email');
        if (emailSalvo) {
            document.getElementById('emailLogin').value = emailSalvo;
            document.getElementById('lembrarEmail').checked = true;
        }

        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            mostrarApp();
        }
    });
</script>
</body>
</html>
